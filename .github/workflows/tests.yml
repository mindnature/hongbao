name: Hongbao tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -e ".[test]"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version
      - name: Run tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          python -m hongbao --help
          python -m hongbao gif2mp4 --help
          python -m hongbao check-gif --help
          python -m hongbao motion --help
          python -m hongbao frames --help
