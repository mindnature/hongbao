[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hongbao-skill"
version = "0.6.0"
description = "Codex Skill for WeChat red packet cover design, validation, and assisted upload"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13"]

[project.optional-dependencies]
images = ["openai>=1.75"]
browser = ["playwright>=1.48"]
test = ["pytest>=8.0"]
all = ["openai>=1.75", "playwright>=1.48", "pytest>=8.0"]

[project.scripts]
hongbao = "hongbao.cli:main"

[tool.setuptools.packages.find]
include = ["hongbao*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
